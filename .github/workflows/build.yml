name: Build & Release JAR

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/web_programming_grading

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Run tests
        run: ./mvnw test

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=v$(date +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Auto-release from commit ${{ github.sha }}
          files: |
            backend/web_programming_grading/web_programming_grading_api/target/*.jar
            backend/web_programming_grading/web_programming_grading_executor/target/*.jar
            backend/web_programming_grading/web_programming_grading_core/target/*.jar
          fail_on_unmatched_files: false
