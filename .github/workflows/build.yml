name: Build, Release & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERSION: v1.${{ github.run_number }}
  DOCKERHUB_NS: vucongtuanduong
  CONFIG_REPO: Duong-Vu-practice-workspace/web-programming-grading-config-test1

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/web_programming_grading

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Run tests
        run: ./mvnw test

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            Auto-release from commit ${{ github.sha }}
          files: |
            backend/web_programming_grading/web_programming_grading_api/target/*.jar
            backend/web_programming_grading/web_programming_grading_executor/target/*.jar
            backend/web_programming_grading/web_programming_grading_core/target/*.jar
          fail_on_unmatched_files: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: backend/web_programming_grading
          file: backend/web_programming_grading/Dockerfile.api
          push: true
          tags: |
            ${{ env.DOCKERHUB_NS }}/web-grading-api:${{ env.VERSION }}
            ${{ env.DOCKERHUB_NS }}/web-grading-api:latest

      - name: Build & Push Executor image
        uses: docker/build-push-action@v6
        with:
          context: backend/web_programming_grading
          file: backend/web_programming_grading/Dockerfile.executor
          push: true
          tags: |
            ${{ env.DOCKERHUB_NS }}/web-grading-executor:${{ env.VERSION }}
            ${{ env.DOCKERHUB_NS }}/web-grading-executor:latest

      - name: Update config repo (ArgoCD)
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ env.CONFIG_REPO }}.git config-repo
          cd config-repo
          sed -i 's|tag: .*|tag: "${{ env.VERSION }}"|' values-stg.yaml
          git config user.email "ci@web-grading.com"
          git config user.name "GitHub CI"
          git add .
          git commit -m "Update images to version ${{ env.VERSION }}"
          git push

      - name: Trigger Kaggle Notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install -q kaggle

          # 1. Đoạn script Python để tự động dừng (Cancel) notebook nếu nó đang chạy
          python3 -c "
          import kaggle
          from kaggle.api.kaggle_api_extended import KaggleApi
          import sys

          api = KaggleApi()
          api.authenticate()

          slug = 'duongvucongtuan/duong-test-kaggle-java-hosting1'
          try:
              # Kiểm tra trạng thái hiện tại của Notebook
              status = api.kernel_status(slug)
              current_status = status.get('status', '').lower()
              print(f'Trạng thái hiện tại của notebook: {current_status}')

              # Nếu đang chạy ngầm hoặc đang xếp hàng đợi, thực hiện hủy bỏ
              if current_status in ['running', 'queued']:
                  print('Phát hiện notebook cũ đang chạy. Đang tiến hành hủy tác vụ...')
                  api.kernel_cancel(slug)
                  print('Đã gửi yêu cầu hủy thành công.')
          except Exception as e:
              print(f'Không thể kiểm tra hoặc dừng notebook (Có thể do chưa từng chạy): {e}')
          "

          # 2. Đợi 5 giây để hệ thống Kaggle cập nhật trạng thái hủy hoàn toàn
          sleep 5

          # 3. Tải metadata hiện tại và đẩy phiên bản mới lên chạy
          mkdir -p /tmp/kernel
          kaggle kernels pull duongvucongtuan/duong-test-kaggle-java-hosting1 -p /tmp/kernel -m
          kaggle kernels push -p /tmp/kernel
